[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.6",
    "langgraph-cli[inmem]>=0.4.30",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "sprite-core",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
sprite-core = { path = "../packages/sprite_core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
